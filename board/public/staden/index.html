<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staden</title>
<style>
  :root { --bg:#0b0d10; --panel:#12151a; --line:#1f242c; --fg:#e6e8eb; --dim:#7d8590; --accent:#ffb454; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 ui-monospace, Menlo, monospace; min-height:100vh; }
  header { display:flex; align-items:center; gap:16px; padding:0 16px; height:48px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  header a { color:var(--dim); text-decoration:none; font-size:13px; } header a:hover { color:var(--fg); }
  header .n { margin-left:auto; color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap:16px; padding:16px; }
  .k { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; aspect-ratio: 4/3; position:relative; animation: in .4s ease-out; }
  @keyframes in { from { opacity:0; transform:scale(.97);} to { opacity:1; transform:none;} }
  .k iframe { width:100%; height:100%; border:0; background:#000; }
  .k span { position:absolute; left:10px; bottom:8px; color:var(--dim); font-size:12px; background:rgba(11,13,16,.8); padding:2px 8px; border-radius:6px; }
  #puls { display:flex; gap:8px; overflow:hidden; padding:10px 16px; border-bottom:1px solid var(--line); min-height:44px; align-items:center; }
  #puls:empty::before { content:'pulsen är tyst  ·  tools/board.sh emit ping'; color:var(--dim); font-size:13px; }
  .e { flex:none; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:13px; white-space:nowrap; animation: pop .5s ease-out; }
  .e b { color:var(--accent); font-weight:600; } .e i { color:var(--dim); font-style:normal; } .e u { text-decoration:none; color:#5fd7a7; }
  .e.d2 { border-color:#3b4a5a; } .e.d3 { border-color:#5a4a3b; } .e.d4 { border-color:#6a3b3b; }
  @keyframes pop { from { opacity:0; transform:translateX(-12px) scale(.9); background:#2a2216;} to { opacity:1; transform:none; } }
  .k.blink { animation: blink 1.2s ease-out; } @keyframes blink { 0% { box-shadow:0 0 0 2px var(--accent);} 100% { box-shadow:0 0 0 0 transparent;} }
  .tom { color:var(--dim); padding:48px 16px; text-align:center; grid-column:1/-1; }
</style>
</head>
<body>
<header><h1>Staden</h1><a href="/">Torget</a><a href="/workshop">workshop</a><span class="n" id="n"></span></header>
<div id="puls"></div>
<main id="m"></main>
<script>
const seen = new Set();
async function load() {
  const list = await fetch('/api/kvarter').then(r => r.json());
  const m = document.getElementById('m');
  for (const k of list) {
    if (seen.has(k)) continue; seen.add(k);
    const d = document.createElement('div'); d.className = 'k';
    d.innerHTML = `<iframe src="/staden/kvarter/${encodeURIComponent(k)}" sandbox="allow-scripts allow-same-origin" loading="lazy"></iframe><span>${k.replace(/\.html$|\/$/, '')}</span>`;
    m.appendChild(d);
  }
  document.getElementById('n').textContent = list.length + ' kvarter';
  if (!list.length) m.innerHTML = '<div class="tom">Inga kvarter ännu. Första PR:en som mergas dyker upp här.</div>';
}
load(); setInterval(load, 30000);

// pulsremsan: senaste händelserna på #staden-puls, nyast först. Kvarteret som postade blinkar till.
const pulsEl = document.getElementById('puls');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function visa(e) {
  const d = document.createElement('span'); d.className = 'e d' + (e.djup || 1);
  d.innerHTML = `<b>${esc(e.typ)}</b> <i>${esc(e.från)}</i>${e.orsak ? ` <u>↩${e.orsak}</u>` : ''}`;
  d.title = JSON.stringify(e.nyttolast ?? '');
  pulsEl.prepend(d); while (pulsEl.children.length > 40) pulsEl.lastChild.remove();
  for (const k of document.querySelectorAll('.k')) if (k.querySelector('span')?.textContent === e.från) { k.classList.remove('blink'); void k.offsetWidth; k.classList.add('blink'); }
}
fetch('/api/puls?limit=30').then(r => r.json()).then(l => l.forEach(visa)).catch(() => {});
new EventSource('/api/stream?channel=staden-puls').onmessage = m => { try { const msg = JSON.parse(m.data); const e = JSON.parse(msg.text); visa({ id: msg.id, ...e }); } catch {} };
</script>
</body>
</html>
