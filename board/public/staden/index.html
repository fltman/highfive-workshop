<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staden</title>
<style>
  :root { --bg:#0b0d10; --panel:#12151a; --line:#1f242c; --fg:#e6e8eb; --dim:#7d8590; --accent:#ffb454; --me:#5fd7a7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 ui-monospace, Menlo, monospace; min-height:100vh; }
  header { display:flex; align-items:center; gap:16px; padding:0 16px; height:48px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:3; }
  header h1 { font-size:16px; margin:0; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  header a { color:var(--dim); text-decoration:none; font-size:13px; } header a:hover { color:var(--fg); }
  header .n { margin-left:auto; color:var(--dim); font-size:12px; }

  /* pulsremsan: nyast till vänster, tonar ut åt höger i stället för att klippas */
  #puls { display:flex; gap:8px; overflow:hidden; padding:10px 16px; border-bottom:1px solid var(--line); min-height:46px; align-items:center; position:sticky; top:48px; background:var(--bg); z-index:2;
          -webkit-mask-image: linear-gradient(to right, #000 80%, transparent); mask-image: linear-gradient(to right, #000 80%, transparent); }
  #puls:empty::before { content:'pulsen är tyst  ·  tools/board.sh emit ping'; color:var(--dim); font-size:13px; }
  .e { flex:none; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:13px; white-space:nowrap; max-width:420px; overflow:hidden; text-overflow:ellipsis; animation: pop .5s ease-out; }
  .e b { color:var(--accent); font-weight:600; } .e i { color:var(--dim); font-style:normal; } .e u { text-decoration:none; color:var(--me); } .e s { text-decoration:none; color:#aab1ba; }
  .e.d2 { border-color:#3b4a5a; } .e.d3 { border-color:#5a4a3b; } .e.d4 { border-color:#6a3b3b; }
  @keyframes pop { from { opacity:0; transform:translateX(-12px) scale(.9); background:#2a2216;} to { opacity:1; transform:none; } }

  /* kvarteren: två kolumner på en vanlig skärm, rutan växer med sitt innehåll upp till ett tak */
  main { display:grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap:16px; padding:16px; align-items:start; }
  .k { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; animation: in .4s ease-out; }
  @keyframes in { from { opacity:0; transform:scale(.97);} to { opacity:1; transform:none;} }
  .k .bar { display:flex; align-items:center; gap:10px; padding:7px 12px; border-bottom:1px solid var(--line); font-size:12px; color:var(--dim); flex:none; }
  .k .bar b { color:var(--fg); font-weight:600; letter-spacing:.04em; }
  .k .bar .dot { width:7px; height:7px; border-radius:50%; background:#2b323c; transition:background .3s; }
  .k.blink .bar .dot { background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .k .bar .sp { margin-left:auto; }
  .k .bar a, .k .bar button { color:var(--dim); background:none; border:0; font:inherit; cursor:pointer; text-decoration:none; padding:2px 6px; border-radius:5px; }
  .k .bar a:hover, .k .bar button:hover { color:var(--fg); background:#1b2027; }
  .k iframe { width:100%; height:340px; border:0; background:var(--bg); display:block; }
  .k.blink { animation: blink 1.4s ease-out; } @keyframes blink { 0% { border-color:var(--accent);} 100% { border-color:var(--line);} }
  .k.liten iframe { height:200px; }

  /* helskärm för demo */
  .k.stor { position:fixed; inset:48px 0 0 0; z-index:5; border-radius:0; border:0; }
  .k.stor iframe { height:100% !important; flex:1; }
  .tom { color:var(--dim); padding:48px 16px; text-align:center; grid-column:1/-1; }
  @media (min-width: 1700px) { main { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<header><h1>Staden</h1><a href="/">Torget</a><a href="/workshop">workshop</a><span class="n" id="n"></span></header>
<div id="puls"></div>
<main id="m"></main>
<script>
const seen = new Map();           // filnamn -> kort
const MIN = 340, MAX = 720;       // rutans höjd följer innehållet mellan de här gränserna
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const namn = k => k.replace(/\.html$|\/$/, '');

function kort(k) {
  const t = namn(k), url = '/staden/kvarter/' + encodeURIComponent(namn(k)) + (k.endsWith('/') ? '/' : '.html');
  const d = document.createElement('section'); d.className = 'k' + (t === 'torget' ? ' liten' : ''); d.dataset.team = t;
  d.innerHTML = `<div class="bar"><span class="dot"></span><b>${esc(t)}</b><span class="sp"></span><a href="/t/${encodeURIComponent(t)}/" target="_blank" title="backend">/t/${esc(t)}</a><a href="${url}" target="_blank" title="öppna i egen flik">↗</a><button title="helskärm (Esc stänger)">⤢</button></div><iframe src="${url}" sandbox="allow-scripts allow-same-origin allow-forms" loading="lazy"></iframe>`;
  d.querySelector('button').onclick = () => stor(d);
  return d;
}
function stor(d) { const på = !d.classList.contains('stor'); document.querySelectorAll('.k.stor').forEach(x => x.classList.remove('stor')); d.classList.toggle('stor', på); document.body.style.overflow = på ? 'hidden' : ''; }
addEventListener('keydown', e => { if (e.key === 'Escape') { document.querySelectorAll('.k.stor').forEach(x => x.classList.remove('stor')); document.body.style.overflow = ''; } });

// Låt rutan växa med innehållet. Samma origin, så vi får läsa iframens höjd.
function passa() {
  for (const d of seen.values()) {
    if (d.classList.contains('stor') || d.classList.contains('liten')) continue;
    const f = d.querySelector('iframe');
    try {
      const doc = f.contentDocument; if (!doc || !doc.body) continue;
      // kvarter som låst sig till 100% höjd rapporterar bara rutans höjd: mät då det som skrollar inuti
      let h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
      for (const el of doc.querySelectorAll('*')) if (el.scrollHeight > el.clientHeight + 4 && el.clientHeight > 40) h = Math.max(h, f.clientHeight + (el.scrollHeight - el.clientHeight));
      const mål = Math.max(MIN, Math.min(MAX, Math.ceil(h)));
      if (Math.abs(mål - f.clientHeight) > 6) f.style.height = mål + 'px';
    } catch {}
  }
}
setInterval(passa, 1500);

async function load() {
  const list = await fetch('/api/kvarter').then(r => r.json()).catch(() => []);
  const m = document.getElementById('m');
  list.sort((a, b) => (namn(a) === 'torget') - (namn(b) === 'torget') || a.localeCompare(b, 'sv'));
  for (const k of list) { if (seen.has(k)) continue; const d = kort(k); seen.set(k, d); const t = m.querySelector('.k.liten'); t && !d.classList.contains('liten') ? m.insertBefore(d, t) : m.appendChild(d); }
  document.getElementById('n').textContent = list.length + ' kvarter';
  if (!list.length) m.innerHTML = '<div class="tom">Inga kvarter ännu. Första PR:en som mergas dyker upp här.</div>';
}
load(); setInterval(load, 20000);

// pulsremsan
const pulsEl = document.getElementById('puls');
function sammanfatta(n) { if (n == null) return ''; if (typeof n === 'string') return n; for (const k of ['text', 'omdöme', 'plats', 'förare', 'vad', 'till']) if (typeof n[k] === 'string') return n[k]; return ''; }
function visa(e) {
  const d = document.createElement('span'); d.className = 'e d' + (e.djup || 1);
  const s = sammanfatta(e.nyttolast);
  d.innerHTML = `<b>${esc(e.typ)}</b> <i>${esc(e.från)}</i>${e.orsak ? ` <u>↩${e.orsak}</u>` : ''}${s ? ` <s>${esc(s.slice(0, 60))}</s>` : ''}`;
  d.title = JSON.stringify(e.nyttolast ?? '');
  pulsEl.prepend(d); while (pulsEl.children.length > 30) pulsEl.lastChild.remove();
  const k = document.querySelector(`.k[data-team="${CSS.escape(e.från)}"]`);
  if (k) { k.classList.remove('blink'); void k.offsetWidth; k.classList.add('blink'); setTimeout(() => k.classList.remove('blink'), 1500); }
}
fetch('/api/puls?limit=30').then(r => r.json()).then(l => l.forEach(visa)).catch(() => {});
new EventSource('/api/stream?channel=staden-puls').onmessage = m => { try { const msg = JSON.parse(m.data); const e = JSON.parse(msg.text); visa({ id: msg.id, ...e }); } catch {} };
</script>
</body>
</html>
